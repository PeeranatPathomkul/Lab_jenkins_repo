# Pod for the source-level checks (Verify, Policy Gate, SonarQube). One pod,
# one workspace: every tool below sees the same checkout, so audit.json and
# the coverage report are handed between stages without stash/unstash.
# Each container just waits (`cat`); the Jenkinsfile runs steps in it with
# container('<name>').
apiVersion: v1
kind: Pod
spec:
  securityContext:
    # Same UID as the jnlp container that owns the workspace.
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  initContainers:
    # hostPath directories are created root-owned; open the npm cache to UID 1000.
    - name: cache-permissions
      image: busybox:1.37
      command: ["sh", "-c", "chmod 0777 /cache/npm"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - { name: npm-cache, mountPath: /cache/npm }
  containers:
    - name: node
      image: node:20-alpine
      command: ["cat"]
      tty: true
      env:
        - { name: npm_config_cache, value: /cache/npm }
      volumeMounts:
        - { name: npm-cache, mountPath: /cache/npm }
    - name: semgrep
      image: semgrep/semgrep:1.177.0
      command: ["cat"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
    - name: syft
      # -debug: the distroless image plus busybox, so the agent can run sh in it.
      image: anchore/syft:v1.52.0-debug
      command: ["cat"]
      tty: true
      env:
        - { name: XDG_CACHE_HOME, value: /tmp }
    - name: cosign
      # -dev: cosign plus busybox (the release image has no shell).
      image: ghcr.io/sigstore/cosign/cosign:v3.1.3-dev
      command: ["cat"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
    - name: opa
      image: openpolicyagent/opa:1.21.0-debug
      command: ["cat"]
      tty: true
    - name: terraform
      image: hashicorp/terraform:1.16.4
      command: ["cat"]
      tty: true
      securityContext:
        # Writes the shared provider cache (a root-owned hostPath).
        runAsUser: 0
      env:
        - { name: HOME, value: /tmp }
        - { name: TF_IN_AUTOMATION, value: "1" }
        - { name: TF_PLUGIN_CACHE_DIR, value: /cache/terraform }
        # Private .terraform dir: validate runs without the S3 backend.
        - { name: TF_DATA_DIR, value: /tmp/tf-validate-data }
      volumeMounts:
        - { name: terraform-cache, mountPath: /cache/terraform }
    - name: ansible-lint
      # ansible-lint 26.1.1 (no version tags published, so pinned by digest).
      image: pipelinecomponents/ansible-lint@sha256:a767239e6442051d483a85a6ae1c83973c94c7b684f31d2812d8f616081a87af
      command: ["cat"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
    - name: tfsec
      image: aquasec/tfsec:v1.28.14
      command: ["cat"]
      tty: true
    - name: checkov
      image: bridgecrew/checkov:3.3.20
      command: ["cat"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
    - name: sonar-scanner
      image: sonarsource/sonar-scanner-cli:latest
      command: ["cat"]
      tty: true
      env:
        - { name: SONAR_USER_HOME, value: /tmp/.sonar }
  volumes:
    # Caches on the kind node, kept between builds (the pods themselves are not).
    - name: npm-cache
      hostPath: { path: /var/cache/jenkins-ci/npm, type: DirectoryOrCreate }
    - name: terraform-cache
      hostPath: { path: /var/cache/jenkins-ci/terraform, type: DirectoryOrCreate }
