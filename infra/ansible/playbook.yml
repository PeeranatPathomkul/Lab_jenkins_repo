---
# Lab 08: configure the host Terraform provisioned (infra/terraform) so it can
# run poonsuk-api: Node.js 20, Docker, and the API image built in Lab 07.
#
# Inventory is generated by the Jenkins "Configure with Ansible" stage from
# `terraform output`. The image to pull is passed as `-e app_image=...`.
- name: Configure the poonsuk-api host
  hosts: app
  become: true
  vars:
    nodejs_major: 20
    # registry:5000 is the Lab 07 registry, reached over the jenkins network.
    registry: registry:5000
  tasks:
    - name: Require the image to pull (never a floating `latest` tag)
      ansible.builtin.assert:
        that:
          - app_image is defined
          - app_image is not search(':latest$')
        fail_msg: Pass -e app_image=registry:5000/poonsuk-api:<commit-sha>

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Add the NodeSource repository for Node.js {{ nodejs_major }}
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/nodesource.asc]
          https://deb.nodesource.com/node_{{ nodejs_major }}.x nodistro main
        filename: nodesource
        state: present

    - name: Install Node.js and Docker
      ansible.builtin.apt:
        name:
          - nodejs
          - docker.io
        state: present
        update_cache: true

    - name: Allow pulling from the lab's plain-HTTP registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          { "insecure-registries": ["{{ registry }}"] }
        mode: "0644"
      notify: Restart docker

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started

    - name: Apply a pending Docker restart before pulling
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Docker daemon
      ansible.builtin.command: docker info
      register: docker_info
      retries: 10
      delay: 3
      until: docker_info.rc == 0
      changed_when: false

    - name: Pull the poonsuk-api image
      ansible.builtin.command: docker pull {{ app_image }}
      register: pull
      changed_when: "'Downloaded newer image' in pull.stdout"

    - name: Report installed versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - node --version
        - docker --version
      register: versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
