---
# Lab 08: configure the host Terraform provisioned (infra/terraform) so it can
# run poonsuk-api: Node.js 20, Docker, and the API image built in Lab 07.
#
# Inventory is generated by the Jenkins "Configure with Ansible" stage from
# `terraform output`. The image to pull is passed as `-e app_image=...`.
- name: Configure the poonsuk-api host
  hosts: app
  become: true
  vars:
    nodejs_major: 20
    # registry:5000 is the Lab 07 registry, reached over the jenkins network.
    registry: registry:5000
  tasks:
    - name: Require the image to pull (never a floating `latest` tag)
      ansible.builtin.assert:
        that:
          - app_image is defined
          - app_image is not search(':latest$')
        fail_msg: Pass -e app_image=registry:5000/poonsuk-api:<commit-sha>

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian # needed by deb822_repository below
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add the NodeSource repository for Node.js {{ nodejs_major }}
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_{{ nodejs_major }}.x
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present

    - name: Install Node.js and Docker
      ansible.builtin.apt:
        name:
          - nodejs
          - docker.io
        state: present
        update_cache: true

    - name: Allow pulling from the lab's plain-HTTP registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          { "insecure-registries": ["{{ registry }}"] }
        mode: "0644"
      notify: Restart docker

    - name: Apply a pending Docker restart (new daemon.json) first
      ansible.builtin.meta: flush_handlers

    # The host is a container stand-in for the VM, with no systemd, so the
    # packaged service unit cannot be used: run dockerd directly if it is not
    # already running.
    - name: Check whether the Docker daemon is running
      ansible.builtin.command: pgrep -x dockerd
      register: dockerd_running
      changed_when: false
      failed_when: false

    - name: Start the Docker daemon
      ansible.builtin.shell: nohup dockerd > /var/log/dockerd.log 2>&1 &
      when: dockerd_running.rc != 0
      changed_when: true

    - name: Wait for the Docker daemon
      ansible.builtin.command: docker info
      register: docker_info
      retries: 10
      delay: 3
      until: docker_info.rc == 0
      changed_when: false

    - name: Pull the poonsuk-api image
      ansible.builtin.command: docker pull {{ app_image }}
      register: pull
      changed_when: "'Downloaded newer image' in pull.stdout"

    - name: Report installed versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - node --version
        - docker --version
      register: versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"

  handlers:
    - name: Restart docker
      ansible.builtin.shell: |
        pkill -x dockerd || true
        while pgrep -x dockerd > /dev/null; do sleep 1; done
        nohup dockerd > /var/log/dockerd.log 2>&1 &
      changed_when: true
