# SonarQube analysis settings, read by `sonar-scanner` in the Jenkinsfile's
# "SonarQube Analysis" stage (run from the backend/ directory).
sonar.projectKey=poonsuk-api
sonar.projectName=poonsuk-api

# Application code vs. tests: specs live next to the code in src/, e2e specs in test/.
sonar.sources=src
sonar.tests=src,test
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Coverage produced by `npm test -- --coverage` in the Unit Test stage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Unit-test coverage scope (same as jest's collectCoverageFrom): the
# dependency-free code in common/, config/ and the health module. The
# DB-bound feature modules, app wiring, migrations and seed scripts are
# exercised by the e2e suites instead, so they are excluded from the unit
# coverage metric that the quality gate checks.
sonar.coverage.exclusions=src/main.ts,src/app.module.ts,src/migrations/**,src/database/**,src/modules/auth/**,src/modules/bookings/**,src/modules/notifications/**,src/modules/payments/**,src/modules/restaurants/**,src/modules/rooms/**,src/modules/users/**

sonar.sourceEncoding=UTF-8
